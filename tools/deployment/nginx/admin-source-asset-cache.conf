# Code-source assets only. HTML, PHP, REST, AJAX, media uploads, reports and JSON remain no-store.
# CSS/JS cache only with ver=; fonts/source images have a bounded one-day private TTL.
map "$request_method:$status:$sent_http_content_type:$arg_ver:$uri" $vialcove_hq_source_cache_control {
    volatile;
    default "private, no-store, max-age=0";
    "~*^(?:GET|HEAD):200:text/css(?:;[^:]*)?:[a-z0-9_.-]{1,80}:/(?:wp-admin/(?:css|js|images)|wp-includes/(?:css|js|fonts|images)|wp-content/plugins/(?:peptide-core|peptide-hq|peptide-panapay|woocommerce)/assets)/(?:[a-z0-9_-]+/)*[a-z0-9_-][a-z0-9_.-]*\\.css$" "public, max-age=86400, s-maxage=86400";
    "~*^(?:GET|HEAD):200:(?:application/javascript|text/javascript)(?:;[^:]*)?:[a-z0-9_.-]{1,80}:/(?:wp-admin/(?:css|js|images)|wp-includes/(?:css|js|fonts|images)|wp-content/plugins/(?:peptide-core|peptide-hq|peptide-panapay|woocommerce)/assets)/(?:[a-z0-9_-]+/)*[a-z0-9_-][a-z0-9_.-]*\\.js$" "public, max-age=86400, s-maxage=86400";
    "~*^(?:GET|HEAD):304::[a-z0-9_.-]{1,80}:/(?:wp-admin/(?:css|js|images)|wp-includes/(?:css|js|fonts|images)|wp-content/plugins/(?:peptide-core|peptide-hq|peptide-panapay|woocommerce)/assets)/(?:[a-z0-9_-]+/)*[a-z0-9_-][a-z0-9_.-]*\\.(?:css|js)$" "public, max-age=86400, s-maxage=86400";
    "~*^(?:GET|HEAD):200:(?:font/woff2?|application/font-woff)(?:;[^:]*)?:[a-z0-9_.-]{0,80}:/(?:wp-admin/(?:css|js|images)|wp-includes/(?:css|js|fonts|images)|wp-content/plugins/(?:peptide-core|peptide-hq|peptide-panapay|woocommerce)/assets)/(?:[a-z0-9_-]+/)*[a-z0-9_-][a-z0-9_.-]*\\.woff2?$" "private, max-age=86400";
    "~*^(?:GET|HEAD):200:image/(?:png|jpeg|gif|svg\\+xml|webp|avif|x-icon|vnd\\.microsoft\\.icon)(?:;[^:]*)?:[a-z0-9_.-]{0,80}:/(?:wp-admin/(?:css|js|images)|wp-includes/(?:css|js|fonts|images)|wp-content/plugins/(?:peptide-core|peptide-hq|peptide-panapay|woocommerce)/assets)/(?:[a-z0-9_-]+/)*[a-z0-9_-][a-z0-9_.-]*\\.(?:png|jpe?g|gif|svg|webp|avif|ico)$" "private, max-age=86400";
