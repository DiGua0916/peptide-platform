; /etc/php/8.3/fpm/conf.d/99-vialcove-opcache.ini on both hosts (2026-11-09).
; Each store (and each admin copy) is a full code copy of WP + WooCommerce + our plugins; six or seven copies
; share one opcache, so the Debian default of 128M filled up and every request was recompiled (hit rate 0.2%).
opcache.memory_consumption=768
opcache.interned_strings_buffer=48
opcache.max_accelerated_files=50000
opcache.validate_timestamps=1
opcache.revalidate_freq=30
opcache.save_comments=1
