# Merge inside each sandbox server, preserving its access gateway and headers.
# Compress transport representations; never cache commerce JSON or private HTML.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied no-cache no-store private auth;
gzip_types application/json;
# Existing location-specific CSS/JS/SVG compression rules remain unchanged.
