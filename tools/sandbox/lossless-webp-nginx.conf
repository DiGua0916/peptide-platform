# Merge the map in http context; merge the remaining rules into each sandbox
# server only. Do not replace the existing authentication or security headers.
map $http_accept $vc_sbx_webp {
    default "";
    "~*image/webp\s*;\s*q=0(?:\.0*)?(?:\s*[,;]|$)" "";
    "~*image/webp(?:\s*[,;]|$)" ".webp";
}

# server context (keep alongside existing add_header directives):
# add_header Vary Accept always;
# location ~ \.png$ { try_files $uri$vc_sbx_webp $uri =404; }

# Sandbox product images can be reused by the same browser for five minutes.
# Apply only to successful authenticated static-image responses; keep the access
# gateway's redirects/errors, HTML, APIs, orders and private PDFs no-store.
# Cache-Control: private, max-age=300, must-revalidate
# Keep ETag/Last-Modified and Vary: Accept, and preserve inherited security headers
# when adding a location-level header. Do not add public/CDN commerce caching.
