<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目聊天室 · 多肽独立站</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M20.5 11.2a8.5 8.5 0 0 1-8.7 8.1 10.8 10.8 0 0 1-3.8-.7l-4.4 1.5 1.2-4A7.8 7.8 0 0 1 3 11.2a8.5 8.5 0 0 1 8.8-8.1 8.5 8.5 0 0 1 8.7 8.1Z"/><path d="M8 11h.01M12 11h.01M16 11h.01" stroke-width="2.8"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="7.5" r="3.2"/><path d="M2.8 20v-2a6.2 6.2 0 0 1 12.4 0v2ZM17 4.5a3.2 3.2 0 0 1 0 6.2M18.5 14a5.5 5.5 0 0 1 3 5"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.8"/><path d="m16 16 4.7 4.7"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/></symbol>
<symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 9h.01M16 9h.01M7.5 14a5 5 0 0 0 9 0"/></symbol>
<symbol id="i-code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6M16 6l6 6-6 6m-9 3 4-18"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-1.5 7M20 4v6h-6"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
</defs></svg>
<div class="app">
<nav class="rail" aria-label="聊天室导航">
<span class="avatar user profile" title="你 · 项目负责人">你</span>
<button class="rail-button active" id="chat-button" title="群聊" aria-label="群聊"><svg><use href="#i-chat"/></svg></button>
<button class="rail-button" data-members title="群成员" aria-label="群成员" aria-expanded="false"><svg><use href="#i-users"/></svg></button>
<button class="rail-button" data-source title="查看 Markdown 原文" aria-label="查看 Markdown 原文"><svg><use href="#i-file"/></svg></button>
<div class="rail-spacer"></div><button class="rail-button" data-members title="群聊信息" aria-label="群聊信息" aria-expanded="false"><svg><use href="#i-menu"/></svg></button>
</nav>
<aside class="sidebar" id="sidebar" aria-label="会话列表">
<div class="search-area"><label class="search"><svg><use href="#i-search"/></svg><input id="search" type="search" autocomplete="off" placeholder="搜索聊天记录" aria-label="搜索消息或任务编号"></label><button class="icon-button sidebar-close" id="close-sidebar" aria-label="关闭会话列表"><svg><use href="#i-close"/></svg></button></div>
<div class="list-caption">聊天</div>
<button class="conversation selected" id="room-button" aria-label="多肽项目群，查看全部消息"><span class="group-avatar" aria-hidden="true"><span class="mini codex">C</span><span class="mini claude">✳</span><span class="mini user">你</span><span class="mini project">P</span></span><span class="conversation-copy"><span class="conversation-top"><strong>多肽项目群</strong><time id="last-time"></time></span><span id="last-preview" class="conversation-preview">你、Codex、Claude</span></span></button>
<div class="sidebar-bottom"><div class="sync"><span id="sync-dot" class="sync-dot"></span><span id="sync-label" role="status">正在连接…</span></div><span>本地聊天室 · <span id="total-count">0</span> 条消息</span></div>
</aside>
<main class="chat-main">
<header class="chat-header"><button class="icon-button mobile-menu" id="open-sidebar" aria-label="打开会话列表" aria-expanded="false"><svg><use href="#i-menu"/></svg></button><h1>多肽项目群<span> (3)</span></h1><div class="header-actions"><button class="icon-button" id="find-button" aria-label="搜索聊天记录" title="搜索聊天记录"><svg><use href="#i-search"/></svg></button><button class="icon-button" data-members aria-label="群聊详情" title="群聊详情" aria-expanded="false"><svg><use href="#i-more"/></svg></button></div></header>
<div class="filter-bar" id="filter-bar" hidden><span id="filter-label"></span><button id="clear-filter">查看全部消息 ×</button></div>
<div id="warning" class="warning" role="status" hidden></div>
<section class="timeline" id="timeline" aria-label="聊天记录" tabindex="0"><div id="messages" class="messages" aria-label="项目消息列表"><div class="empty">正在读取聊天记录…</div></div></section>
<button id="jump-latest" class="jump-latest" hidden>↓ 查看新消息</button>
<section class="composer" aria-label="发送项目留言"><form id="message-form">
<div class="composer-tools"><div class="tool-group"><button type="button" class="icon-button" id="emoji-button" title="表情" aria-label="表情" aria-expanded="false"><svg><use href="#i-smile"/></svg></button><button type="button" class="icon-button" id="code-button" title="插入代码块" aria-label="插入代码块"><svg><use href="#i-code"/></svg></button><button type="button" class="icon-button" data-source title="查看 Markdown 原文" aria-label="查看 Markdown 原文"><svg><use href="#i-file"/></svg></button></div><button type="button" class="icon-button" id="refresh" title="刷新记录" aria-label="刷新记录"><svg><use href="#i-refresh"/></svg></button></div>
<div class="emoji-picker" id="emoji-picker" role="group" aria-label="选择表情" hidden><button type="button">😊</button><button type="button">👍</button><button type="button">👌</button><button type="button">🎉</button><button type="button">✅</button><button type="button">💡</button><button type="button">👀</button><button type="button">☕</button></div>
<label class="sr-only" for="message-input">项目留言内容</label><textarea id="message-input" rows="3" maxlength="32000" placeholder="发送消息…" required></textarea>
<div class="composer-bottom"><span id="send-status" role="status">留言后需提醒助手读取</span><div class="send-actions"><span class="key-hint">Enter 发送，Shift + Enter 换行</span><button class="send-button" id="send-button" type="submit" disabled>发送</button></div></div>
</form></section>
<aside class="details-panel" id="details-panel" aria-label="群聊详情" hidden>
<div class="panel-heading"><h2>群聊详情</h2><button class="icon-button" id="close-details" aria-label="关闭群聊详情"><svg><use href="#i-close"/></svg></button></div>
<div class="member-grid"><div><span class="avatar user">你</span><strong>你</strong><small>项目负责人</small></div><div><span class="avatar codex">&lt;/&gt;</span><strong>Codex</strong><small>前端设计</small></div><div><span class="avatar claude">✳</span><strong>Claude</strong><small>后端开发</small></div></div>
<section class="detail-section"><h3>群聊名称</h3><p>多肽项目群</p></section>
<section class="detail-section"><h3>查看成员消息</h3><div class="filters" role="group" aria-label="按参与者筛选"><button class="selected" data-author="全部" aria-pressed="true">全部</button><button data-author="Codex" aria-pressed="false">Codex</button><button data-author="Claude" aria-pressed="false">Claude</button><button data-author="用户" aria-pressed="false">你</button></div></section>
<section class="detail-section"><h3>群公告</h3><p>需求、进度和决定，都留在这里。</p><p class="muted">消息保存在本项目。留言后，请提醒对应助手读取；这里不会自动触发 AI 回复。</p></section>
<button class="source-row" data-source>查看 Markdown 原文 <span>›</span></button><p class="record-path" id="record-path">docs/chat/ROOM.md</p>
</aside>
</main></div>
<dialog id="source-dialog" aria-labelledby="source-title"><div class="dialog-header"><h2 id="source-title">Markdown 原文</h2><button class="icon-button" id="close-source" aria-label="关闭原文"><svg><use href="#i-close"/></svg></button></div><p id="source-path"></p><pre id="source-content"></pre><div class="dialog-footer"><span>所有成员共用这一份记录</span><button id="copy-source">复制原文</button></div></dialog>
</body></html>
